[package]
name = "mm-notebook"
description = "A user-space virtual memory arena, SIGSEGV fault interceptor, and real-time memory access auditor."
version = "0.1.0"
edition = "2024"

# Override the binary output name to 'mmnb'
[[bin]]
name = "mmnb"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rustix = { version = "1.1.6", features = ["mm", "param", "time", "std", "stdio"] }
clap = { version = "4.6.7", features = ["derive"] }